<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планирование бюджета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap">
<style>
:root{
  /* Палитра: светлая — белый, #EDECF3, голубой #B7D8F1, лососевый #F6A48C, чёрный; тёмная — чёрный, синий #271358, розовый #E86C6C, #EDECF3, белый */
  --bg:#EDECF3; --surface:#FFFFFF; --field:#EDECF3; --line:#E2E1EA; --dots:#C4C3CF; --ink:#000000; --muted:#6A6977;
  --accent:#000000; --save:#000000; --pay:#000000;
  --hero:#B7D8F1; --hero-ink:#000000; --hero-track:#FFFFFF; --hero-fill:#000000; --hero-chip:rgba(255,255,255,.6);
  --t-ok:#B7D8F1; --t-ok-ink:#000000; --t-warn:#F6A48C; --t-warn-ink:#000000; --t-grey:#EDECF3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#111115; --field:#1C1C22; --line:#24242B; --dots:#3A3A44; --ink:#FFFFFF; --muted:#A3A2AE;
    --accent:#FFFFFF; --save:#FFFFFF; --pay:#FFFFFF;
    --hero:#271358; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.18); --hero-fill:#E86C6C; --hero-chip:rgba(255,255,255,.14);
    --t-ok:#EDECF3; --t-ok-ink:#000000; --t-warn:#E86C6C; --t-warn-ink:#000000; --t-grey:#24242B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111115; --field:#1C1C22; --line:#24242B; --dots:#3A3A44; --ink:#FFFFFF; --muted:#A3A2AE;
  --accent:#FFFFFF; --save:#FFFFFF; --pay:#FFFFFF;
  --hero:#271358; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.18); --hero-fill:#E86C6C; --hero-chip:rgba(255,255,255,.14);
  --t-ok:#EDECF3; --t-ok-ink:#000000; --t-warn:#E86C6C; --t-warn-ink:#000000; --t-grey:#24242B; color-scheme:dark;
}
/* Типографика: 15 — текст и заголовки блоков, 13 — подписи и вторичное, 24 — ключевые суммы, 20 — заголовок страницы.
   Начертания: 400 и 600. Цвет: ink — основное, muted — вторичное, save/pay — только статус суммы, accent — только управление.
   Сетка: шаг 4 px; внутри блока отступ 16, между элементами 12, строки списков 8 по вертикали, вложенные строки сдвинуты на 12. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:20px 16px 40px;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;font-weight:600;line-height:1.2;margin:0 0 4px}
h2,.h3{font-size:15px;font-weight:600;line-height:1.45;margin:0}
.h3{margin-top:4px}
b{font-weight:600}
.sub,.lbl,.sm,.when{font-size:13px;font-weight:400;color:var(--muted);margin:0}
.pos{color:var(--save)}
.neg{color:var(--pay)}
.err,#xerr,#derr,#cerr{font-size:13px;color:var(--pay)}
.err:empty,#xerr:empty,#derr:empty,#cerr:empty{display:none}

/* Блоки */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.tg{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;user-select:none;-webkit-tap-highlight-color:transparent}
.tg::after,.ph .pt::after{content:'▾';display:inline-block;font-size:13px;font-weight:400;line-height:1;color:var(--muted);transition:transform .15s}
.ph .pt::after{margin-left:6px}
section.collapsed>.tg::after,#bh .hm.closed .hmh::after,.per.closed .ph .pt::after{transform:rotate(-90deg)}
section.collapsed>:not(h2){display:none!important}
@media (prefers-reduced-motion:reduce){.tg::after,#bh .hmh::after,.ph .pt::after{transition:none}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.tabs button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-radius:9px;padding:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
main[data-tab="day"]>section[data-tab="long"],main[data-tab="long"]>section[data-tab="day"]{display:none!important}


/* Строки списков и таблиц */
.debts,.lst{width:100%;border-collapse:collapse}
.debts td,.lst td{padding:8px 0;border-top:1px solid var(--line);vertical-align:middle}
.debts tr:first-child td,.lst tr:first-child td{border-top:0}
.debts td:first-child{width:32px}
.debts td:nth-child(3),.debts td:nth-child(4),.lst td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.debts td:nth-child(4),#xt td:first-child,#vtb td:first-child,#atb td:first-child{color:var(--muted)}
#xt td:first-child,#vtb td:first-child,#atb td:first-child{width:auto;white-space:nowrap;padding-right:12px}
#xt td:nth-child(2),#vtb td:nth-child(2),#atb td:nth-child(2){width:100%}
#xt td:nth-child(3),#vtb td:nth-child(3),#atb td:nth-child(3){text-align:right;white-space:nowrap}
#sav #vtb td:first-child{color:var(--hero-ink);opacity:.75}
.debts tr.paid td:not(:first-child){text-decoration:line-through;color:var(--muted)}
.debts input,.si input,.wi input,.df .ck input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--save);flex:none;display:block}
.lst .sub{margin-top:2px}
.wi,.si{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wi:first-child,.si:first-child{border-top:0}
.wi .nm,.si label{flex:1;min-width:0;overflow-wrap:anywhere}
.wi .pr{white-space:nowrap;color:var(--muted)}
.wi.ok .pr{color:var(--save)}
.wi.done,.si.done{color:var(--muted)}
.wi.done .nm,.si.done label{text-decoration:line-through}

/* История трат */
#bh{display:grid}
#bh span{min-width:0}
#bh>.tot,#bh .hmb>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
#bh>.tot{border-top:0;font-weight:600}
#bh b{font-weight:400;white-space:nowrap}
#bh .tot b,#bh .hmh b{font-weight:600}
#bh .hm{border-top:1px solid var(--line)}
#bh .hm.closed .hmb{display:none}
#bh .hmh{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:0;padding:8px 0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
#bh .emp{color:var(--muted)}
#bh .hd{font-style:normal;color:var(--muted);display:inline-block;min-width:3.4em}

/* График по периодам */
.per{border-top:1px solid var(--line)}
.per:first-child{border-top:0}
.ph{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:0;padding:8px 0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.ph .pt{font-weight:600;flex:1}
.ph b{white-space:nowrap}
.per .tag{font-size:13px;color:var(--muted)}
.per.closed .pbd{display:none}
.pbd{display:grid;gap:4px;padding-bottom:12px}
.pl,.pi,.ps>div{display:flex;justify-content:space-between;gap:12px}
.pl{font-weight:600;margin-top:8px}
.pbd>.pl:first-child{margin-top:0}
.pi{font-size:13px;color:var(--muted);padding-left:12px}
.pi span:last-child,.pl b,.ps b{white-space:nowrap}
.ps{display:grid;gap:4px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:600}
.pf{font-size:13px;color:var(--muted)}
.pf .nw{white-space:nowrap}

/* Формы и кнопки */
.bud form,.df{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bud input,.df input,.df select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.df input{flex:1 1 120px}
.bud input[type=number]{flex:1 1 90px;width:90px}
.bud #bn{flex:1 1 120px}
.bud input[type=date],.df input[type=date]{flex:none;width:9.2em}
.df .fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 120px;min-width:0}
.df .fl input{flex:none;width:100%}
.df .ck{display:flex;align-items:center;gap:8px}
.bud button,.df button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.bud input[type=checkbox]:disabled{opacity:.4}
:root[data-theme="dark"] .bud button,:root[data-theme="dark"] .df button{color:#0E141A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bud button,:root:not([data-theme="light"]) .df button{color:#0E141A}}
.addp{justify-self:start;font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.panel button.x,.panel button.hx,.panel button.wx{background:none;border:0;border-radius:0;color:var(--muted);font:inherit;font-size:17px;font-weight:400;line-height:1;padding:0 0 0 12px;cursor:pointer}

/* Подвал */
.ft{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:4px 0}
.bkm{font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Дизайн-система v2 (пилот: «Каждый день») =====
   Шрифт Golos Text. Роли текста:
   .big-n — главная сумма экрана, 64/800, единица 22/700;  .mid-n — сумма блока, 36/800, единица 18/600;
   h1 — 30/800;  h2 — 20/800;  текст — 15/400;  подпись .lbl — 14/400 muted;  шильдик .tag — 12/700.
   Цифры всегда табличные, крупные — с плотным трекингом.
   Поверхности: фон --bg, карточка-блок --surface (радиус 24, без рамки), главный блок экрана — цветная --hero.
   Внутри карточки без подложек: строки на разделителях, итоги — строкой с точечным лидером (.lead).
   Управление: тёмные пилюли (кнопки, вкладки), поля — заливка --field без рамки. */
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 8px}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
/* Переключатель вкладок: дорожка и бегунок, бегунок едет за main[data-tab] */
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);padding:4px;border-radius:999px}
.tabs::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--ink);transition:transform .2s ease}
main[data-tab="long"] .tabs::before{transform:translateX(100%)}
.tabs button{position:relative;padding:10px 12px;border-radius:999px;background:none;color:var(--muted);transition:color .2s}
.tabs button[aria-selected="true"]{background:none;color:var(--bg)}
@media (prefers-reduced-motion:reduce){.tabs::before,.tabs button{transition:none}}
.panel{border:0;border-radius:24px;padding:20px;grid-template-columns:minmax(0,1fr)}
.tg::after{content:'▾';width:32px;height:32px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:12px;color:var(--ink);flex:none}
.bud button,.df button{border-radius:999px;padding:12px 20px;background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] .bud button,:root[data-theme="dark"] .df button{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bud button,:root:not([data-theme="light"]) .df button{color:var(--bg)}}
.bud input:not([type=checkbox]),.df input:not([type=checkbox]),.df select{background:var(--field);border:0;border-radius:14px;padding:12px 14px}

/* Крупные числа */
.big-n,.mid-n{display:flex;align-items:baseline;gap:4px;font-weight:800;line-height:1;letter-spacing:-.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.big-n .n{font-size:64px}
.big-n .u{font-size:22px;font-weight:700;letter-spacing:0}
.mid-n .n{font-size:36px}
.mid-n .u{font-size:18px;font-weight:600;letter-spacing:0;opacity:.7}
.lbl{font-size:14px}

/* Точечный лидер: «название ……… сумма» */
.lead{display:flex;align-items:baseline;gap:8px}
.lead i{flex:1;min-width:16px}
.lead b{font-weight:600;white-space:nowrap}

/* Шильдик */
.tag{display:inline-block;font-size:12px;font-weight:700;line-height:1;padding:5px 9px;border-radius:999px;background:var(--t-grey);color:var(--ink);white-space:nowrap;vertical-align:1px}
.tag.t-ok{background:var(--t-ok);color:var(--t-ok-ink)}
.tag.t-warn{background:var(--t-warn);color:var(--t-warn-ink)}
#today .tag.t-ok{background:var(--surface);color:var(--ink)}
#today .tag.t-grey{background:var(--hero-chip);color:var(--hero-ink)}
#today .lead b .tag{vertical-align:1px}

/* Прогресс-бар: заполнение — потрачено, засечка — норма на сегодня */
#today{background:var(--hero);color:var(--hero-ink);gap:16px}
#today .lbl{color:var(--hero-ink);opacity:.75}
#today .lead i{border-color:currentColor;opacity:.3}
#today .tg::after{background:var(--hero-chip);color:var(--hero-ink)}
/* Две колонки: «Можно сегодня» и «Потрачено» с подковой */
#today .hgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:var(--hlg,8px);margin-bottom:var(--hgap,0px)}
#bt,#bm{display:contents}
#bt>*,#bm>*{justify-self:center;text-align:center}
#bt .big-n{grid-area:1/1;align-self:end;justify-content:center}
#bm .gauge{grid-area:1/2}
#bt .lbl{grid-area:2/1}
#bm .lbl{grid-area:2/2}
/* «Можно» высотой до верхней трети подковы, сумма в подкове меньше и не касается дуги */
#bt .big-n .n{font-size:76px}
#bt .big-n .u{font-size:24px;font-weight:700}
.gauge .gnum .n{font-size:43px}
.gauge .gnum .u{font-size:18px;font-weight:700}
/* Точная подгонка по макету Полины: подписи ниже на 10, «можно» выше на 23, сумма в подкове выше на 13 */
#bt .big-n{position:relative;top:var(--dy0,8.5px)}
.gauge .gnum{transform:translate(3px,var(--dy1,4px))}
.gauge{position:relative;width:150px;max-width:100%;padding-bottom:0}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gauge path{fill:none;stroke-width:11;stroke-linecap:round}
.gauge .gt{stroke:var(--hero-track)}
.gauge .gf{stroke:var(--hero-fill)}
.gauge .gnum{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:baseline;gap:3px;font-weight:800;letter-spacing:-.04em;line-height:1}
#bl{display:grid;gap:8px}
#today .lead>span,#today .lbl{font-size:15px;color:var(--hero-ink);opacity:.75}
#today .lead b{font-weight:400}

/* История трат */
#bh>.tot{display:grid;gap:4px;padding:16px 0 4px}
#bh>.tot span{font-size:15px;font-weight:400;color:var(--muted)}
#bh>.tot b small{font-size:.5em;font-weight:700;letter-spacing:0;margin-right:2px}
#bh>.tot b{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1}
#bh .hm{border-top:0}
#bh .hmh{padding:14px 0;font-size:15px;font-weight:600}
#bh .hmh b{font-weight:600;margin-left:auto}
#bh .hmh::after{content:'▾';margin-left:6px;font-size:13px;font-weight:400;line-height:1;color:var(--muted);flex:none;transition:transform .15s}
#bh .hmb>div{padding:8px 0;border-top:0}
#bh .hmb>div:first-child{padding-top:2px}
#bh .hmb b{font-weight:400}

/* Чекбоксы списков */
#shop input[type=checkbox],#wish input[type=checkbox],#dt input[type=checkbox],#xl{-webkit-appearance:none;appearance:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
#shop input[type=checkbox]:checked,#wish input[type=checkbox]:checked,#dt input[type=checkbox]:checked,#xl:checked{background:var(--ink)}
#shop input[type=checkbox]:checked::before,#wish input[type=checkbox]:checked::before,#dt input[type=checkbox]:checked::before,#xl:checked::before{content:'';width:10px;height:5px;border:solid var(--surface);border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
#wish input[type=checkbox]:disabled,#xl:disabled{opacity:.3;cursor:default}
.wi,.si{padding:10px 0;border-top:0}
.wi .pr{color:var(--ink)}
.wi .pr.t-ok{color:var(--t-ok-ink)}
.wi.done .pr{opacity:.6}
/* Форма траты */
/* Формы добавления: поля с подчёркиванием без заливки, кнопка справа (История трат, Список покупок, Хотелки) */
.panel .addf{display:grid;gap:12px}
.panel .addf .amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);cursor:text}
.panel .addf .amt:focus-within,.panel .addf input[type=text]:focus{border-color:var(--ink)}
.panel .addf .amt input{flex:1;width:100%;min-width:0;border:0;border-radius:0;background:none;padding:10px 0;color:var(--ink);outline:none;-moz-appearance:textfield}
.panel .addf .amt input::-webkit-outer-spin-button,.panel .addf .amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.panel .addf .amt span{color:var(--muted)}
.panel .addf input[type=text]{border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding:10px 0;outline:none}
.panel .addf .addr{display:flex;align-items:center;gap:8px}
.panel .addf .addr button{margin-left:auto}
.panel .addf .frow{display:flex;align-items:flex-end;gap:12px}
.panel .addf .frow>input,.panel .addf .frow>.amt{flex:1;min-width:0}
.panel .addf .frow>button{flex:none}
.dpill{position:relative;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:var(--field);font-weight:600;cursor:pointer}
.dpill::after{content:'▾';font-size:11px;color:var(--muted)}
.dpill:focus-within{outline:2px solid var(--ink);outline-offset:2px}
#bf .dpill #bd{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}
/* Шкала отступов: 4 · 8 · 12 · 16 · 24. Внутри блока между элементами — 16; цифра → подпись — 8;
   инфографика → список — 16 + 16; строки списков — 8 по вертикали; поля формы друг под другом — 12; поле → кнопка в строке — 24 */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px}
.panel{gap:var(--s4)}
#today{gap:var(--s4)}
#today .hgrid{row-gap:var(--s2);margin-bottom:var(--s4)}
#bl{gap:var(--s2)}
.panel .addf{gap:var(--s3);grid-template-columns:minmax(0,1fr)}
.panel .addf .frow>input{width:100%}
.panel .addf .frow{gap:var(--s5)}
#bh .hmb>div{padding:var(--s2) 0}
#bh .hmb>div:first-child{padding-top:0}
#bh .hmh{padding:var(--s3) 0}
#bh>.tot{padding:var(--s4) 0 0;gap:var(--s1)}
.wi,.si{padding:var(--s2) 0}
/* Кнопки удаления не наследуют заливку пилюль */
:root .panel button.x,:root .panel button.hx,:root .panel button.wx{background:none;color:var(--muted);padding:0 0 0 12px;border-radius:0}
/* «Долгосрок» на правилах v2: без разделителей, строки как в истории трат — дата приглушённой колонкой, что, сумма */
.debts td,.lst td{border-top:0;padding:var(--s2) 0}
#dt td:first-child{width:36px}
#dt td:nth-child(3){color:var(--muted);text-align:right;white-space:nowrap;padding-left:12px}
#dt td:nth-child(4){color:var(--ink);text-align:right;white-space:nowrap;padding-left:12px}
#dt td:nth-child(5){width:1%;white-space:nowrap}
#dt tr.paid td:not(:first-child){color:var(--muted)}
.panel .dpill>input,.panel .dpill>select{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
.panel .addf .ck{display:inline-flex;align-items:center;gap:8px}
.nr>span,.pi>span:first-child{display:flex;min-width:0}
.nr .hd,.pi .hd{flex:none}
.nl{display:grid;gap:var(--s2)}
.nr,.pi,.pf>div,.ps>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

se,"name":"Неделя по Шенгену","price":600},"c1791131709316":{"done":false,"name":"Для стирки и унитаза","price":15}},"extra":{"x20260928a":{"amount":71700,"cur":"RUB","date":"2026-09-28","note":"Аванс"},"x20260928b":{"amount":10000,"cur":"RUB","date":"2026-09-28","note":"Кубышка"}},"paid":{"dep-261005":{"done":true},"dorm-261005":{"done":true},"fee-260925":{"done":true},"friend-260928":{"done":true},"olya-261205":{"done":false}},"debts":{},"shop":{"s1791289119257":{"done":false,"name":"шампунь","t":1791289119258}}}, KEY='budget-db-v1', subs={};

        (st?'<span class="tag '+st[0]+'">'+st[1]+'</span>':'')+'<b>'+(plan<0?'<span class="tag t-warn">−'+money(-plan)+'</span>':'+'+money(plan))+'</b></button>'+
        '<div class="pbd"><div class="pl"><span>Доход</span><b>+'+money(inS)+'</b></div>'+ins.map(li).join('')+
        '<div class="pl"><span>На жизнь'+(nx<=today?', по истории':'')+'</span><b>−'+money(lifeS)+'</b></div>'+(now?li(['','потрачено по истории',spentP]):'')+
        (pays.length?'<div class="pl"><span>Обязательные платежи</span><b>−'+money(payS)+'</b></div>'+pays.map(li).join(''):'')+
        (unks.length?'<div class="pl"><span>Неопознанное</span><b>−'+money(unkS)+'</b></div>'+unks.map(li).join(''):'')+
        '<div class="ps">'+(plan>=0?'<div><span>Отложить</span><b>+'+money(plan)+'</b></div>':'<div><span>Не хватает</span><b><span class="tag t-warn">−'+money(-plan)+'</span></b></div>')+'</div>'+
        '<div class="pf">'+(past||now?'<div><span>Отложено</span><b>'+money(fact)+'</b></div>':'')+'<div><span>В копилке</span><b>'+money(cum)+'</b></div></div></div></div>';
    });
    // Итог — сколько будет в копилке к концу плана: отложенное по факту + план на оставшиеся периоды
    const lp=P[P.length-1], le=addD(new Date(lp.from.getFullYear(),lp.from.getMonth()+1,lp.from.getDate()),-1);
    target=Math.round(cum);
    html+='<div class="ptot"><span>В копилке к '+dm(le)+'.'+le.getFullYear()+'</span><b><small>€</small>'+target.toLocaleString('ru-RU').replace(/\s/g,'\u00a0')+'</b></div>';
    planb.innerHTML=html.replace(/(\d) (\d)/g,'$1\u00a0$2');
    renderSav(); renderAcc();
  }
  let cur=null;
  const lead2=(l,v)=>'<div class="lead"><span>'+l+'</span><i></i><b>'+v+'</b></div>';
  const vm=document.getElementById('vm'), vl=document.getElementById('vl');
  // «Накопления»: подкова «накоплено из итога плана», переводы в копилку
  function renderSav(){
    const A=acct(), got=Math.round(saves.reduce((t,v)=>t+v.amount,0)), n=v=>Math.round(v).toLocaleString('ru-RU').replace(/\s/g,'\u00a0');
    const pct=target>0?Math.max(0,Math.min(100,got/target*100)):0, arc='M12 70 A58 58 0 0 1 128 70';
    vm.innerHTML='<div class="lbl">Накоплено из '+eur(target).replace(/ /g,'\u00a0')+'</div><div class="gauge" role="img" aria-label="Накоплено '+eur(got)+' из '+eur(target)+'"><svg viewBox="0 0 140 76" aria-hidden="true"><path class="gt" d="'+arc+'" pathLength="100"/>'+(pct>0?'<path class="gf" d="'+arc+'" pathLength="100" style="stroke-dasharray:'+pct+' 100"/>':'')+'</svg><div class="gnum"><span class="n">'+n(got)+'</span></div></div>';
    vl.innerHTML=(A?lead2('На счету сейчас',eur(Math.round(A.bal))):lead2('На счету','внеси в «На счету»'))+
      (cur?lead2('План на '+cur.range,eur(cur.plan))+lead2('Отложено',(cur.st?'<span class="tag '+cur.st[0]+'">'+cur.st[1]+'</span> ':'')+eur(cur.fact)):'');
    const tb=document.getElementById('vtb'); tb.innerHTML='';
    saves.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).forEach(v=>{
      const tr=document.createElement('tr'), c=[0,1,2].map(()=>document.createElement('td'));
      c[0].textContent=v.date.slice(8)+'.'+v.date.slice(5,7); c[1].textContent=v.amount<0?'из копилки':'в копилку'; c[2].textContent=(v.amount<0?'−':'')+eur(Math.abs(v.amount));
      const x=document.createElement('button'); x.type='button'; x.className='x'; x.textContent='×'; x.setAttribute('aria-label','Удалить перевод');
      x.addEventListener('click',async()=>{ if(!db||!confirm('Удалить перевод '+c[2].textContent+'?')) return; try{ await db.doc('save/'+v.id).delete(); }catch(_){ document.getElementById('verr').textContent='Не удалилось, попробуй ещё раз.'; } });
      c[2].appendChild(x); tr.append(...c); tb.appendChild(tr); });
  }
  // «На счету»: расчёт и корректировки. Разница с расчётом — неопознанный доход или расход в графике
  function renderAcc(){
    const A=acct(), b=document.getElementById('acb');
    b.innerHTML=A?lead2('По расчёту',eur(Math.round(A.bal)))+lead2('Корректировка '+A.sv.date.slice(8)+'.'+A.sv.date.slice(5,7),eur(Math.round(eurOf(A.sv))))+(A.reserve?lead2('Из них на платежи до '+dm(A.pn),eur(Math.round(A.reserve))):''):'<p class="sub" style="margin:0">Внеси, сколько сейчас на счету, — от этого считаются «Можно сегодня» и «Можно отложить».</p>';
    const tb=document.getElementById('atb'); tb.innerHTML='';
    extras.filter(x=>x.kind==='bal'&&x.calc!=null&&Math.round(eurOf(x)-x.calc)).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).forEach(x=>{
      const tr=document.createElement('tr'), c=[0,1,2].map(()=>document.createElement('td')), d=x.calc!=null?Math.round(eurOf(x)-x.calc):0;
      c[0].textContent=x.date.slice(8)+'.'+x.date.slice(5,7);
      c[1].textContent=d<0?'неопознанный расход':d>0?'неопознанный доход':'на счету '+eur(eurOf(x));
      c[2].textContent=d?(d<0?'−':'+')+eur(Math.abs(d)):'';
      const del=document.createElement('button'); del.type='button'; del.className='x'; del.textContent='×'; del.setAttribute('aria-label','Удалить');
      del.addEventListener('click',async()=>{ if(!db||!confirm('Удалить корректировку от '+c[0].textContent+'?')) return; try{ await db.doc('extra/'+x.id).delete(); }catch(_){ document.getElementById('aerr').textContent='Не удалилось, попробуй ещё раз.'; } });
      c[2].appendChild(del); tr.append(...c); tb.appendChild(tr); });
  }
  renderPlan(); planOk=true;
  const mainEl=document.querySelector('main');
  const setTab=t=>{ mainEl.dataset.tab=t; document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t))); try{localStorage.setItem('kopilka-tab',t)}catch(_){} };
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));
  let tab0='day'; try{ if(localStorage.getItem('kopilka-tab')==='long') tab0='long'; }catch(_){}
  if(location.hash==='#long') tab0='long'; if(location.hash==='#day') tab0='day';
  setTab(tab0);
  let fold={}; try{fold=JSON.parse(localStorage.getItem('kopilka-fold3')||'{}')}catch(_){}
  document.querySelectorAll('main > section').forEach((sec,i)=>{
    const hd=sec.querySelector(':scope > h2'); if(!hd) return;
    const k=sec.id||('s'+i);
    hd.classList.add('tg'); hd.setAttribute('role','button'); hd.tabIndex=0;
    const set=c=>{sec.classList.toggle('collapsed',c); hd.setAttribute('aria-expanded',String(!c));};
    set(k in fold ? !!fold[k] : sec.hasAttribute('data-closed'));
    const tog=()=>{const c=!sec.classList.contains('collapsed'); set(c); fold[k]=c?1:0; try{localStorage.setItem('kopilka-fold3',JSON.stringify(fold))}catch(_){}};
    hd.addEventListener('click',tog);
    hd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}});
  });
  planb.addEventListener('click',e2=>{ const h=e2.target.closest('.ph'); if(!h) return;
    const open=h.parentNode.classList.toggle('closed')===false; pOpen[h.dataset.p]=open; h.setAttribute('aria-expanded',String(open)); });
})();
</script>
<script>
/* Бэкап: кладёт базу из localStorage в data.json ветки me. Токен GitHub хранится только в этом браузере. */
(function(){
  const API='https://api.github.com/repos/Skalunova/Saver/contents/data.json', BR='me', TK='saver-gh-token', AT='saver-backup-at';
  const b=document.getElementById('bk'), m=document.getElementById('bkm');
  const get=k=>{ try{ return localStorage.getItem(k); }catch(_){ return null; } };
  const put=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(_){ } };
  const stamp=()=>{ const t=get(AT); m.textContent=t?'бэкап '+t:''; };
  const b64=s=>{ const u=new TextEncoder().encode(s); let r=''; for(let i=0;i<u.length;i+=8192) r+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(r); };
  const fail=t=>{ throw {t}; };
  stamp();
  b.addEventListener('click',async()=>{
    const raw=get('budget-db-v1'); if(!raw){ m.textContent='нечего сохранять'; return; }
    let tk=get(TK);
    if(!tk){ tk=(prompt('Токен GitHub с доступом Contents: read and write к репозиторию Saver')||'').trim(); if(!tk) return; put(TK,tk); }
    const text=JSON.stringify(JSON.parse(raw),null,1)+'\n', h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
    b.disabled=true; m.textContent='сохраняю…';
    try{
      const r=await fetch(API+'?ref='+BR,{headers:h,cache:'no-store'});
      if(r.status===401||r.status===403){ put(TK,null); fail('токен не подошёл'); }
      if(!r.ok&&r.status!==404) fail('ошибка GitHub '+r.status);
      const cur=r.ok?await r.json():null, d=new Date(), z=n=>String(n).padStart(2,'0');
      const ts=z(d.getDate())+'.'+z(d.getMonth()+1)+' '+z(d.getHours())+':'+z(d.getMinutes());
      if(!cur||cur.content.replace(/\s/g,'')!==b64(text)){
        const p=await fetch(API,{method:'PUT',headers:h,body:JSON.stringify({message:'Бэкап данных '+ts,content:b64(text),branch:BR,sha:cur?cur.sha:undefined})});
        if(p.status===401||p.status===403){ put(TK,null); fail('токен не подошёл'); }
        if(!p.ok) fail('ошибка GitHub '+p.status);
      }
      put(AT,ts); stamp();
    }catch(e){ m.textContent=e&&e.t?e.t:'нет связи'; }
    b.disabled=false;
  });
})();
</script>
