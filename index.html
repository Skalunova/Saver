<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планирование бюджета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap">
<style>
:root{
  /* Палитра: светлая — белый, #EDECF3, голубой #B7D8F1, лососевый #F6A48C, чёрный; тёмная — чёрный, синий #271358, розовый #E86C6C, #EDECF3, белый */
  --bg:#EDECF3; --surface:#FFFFFF; --field:#EDECF3; --line:#E2E1EA; --dots:#C4C3CF; --ink:#000000; --muted:#6A6977;
  --accent:#000000; --save:#000000; --pay:#000000;
  --hero:#B7D8F1; --hero-ink:#000000; --hero-track:#FFFFFF; --hero-fill:#000000; --hero-chip:rgba(255,255,255,.6);
  --t-ok:#B7D8F1; --t-ok-ink:#000000; --t-warn:#F6A48C; --t-warn-ink:#000000; --t-grey:#EDECF3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#111115; --field:#1C1C22; --line:#24242B; --dots:#3A3A44; --ink:#FFFFFF; --muted:#A3A2AE;
    --accent:#FFFFFF; --save:#FFFFFF; --pay:#FFFFFF;
    --hero:#271358; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.18); --hero-fill:#E86C6C; --hero-chip:rgba(255,255,255,.14);
    --t-ok:#EDECF3; --t-ok-ink:#000000; --t-warn:#E86C6C; --t-warn-ink:#000000; --t-grey:#24242B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111115; --field:#1C1C22; --line:#24242B; --dots:#3A3A44; --ink:#FFFFFF; --muted:#A3A2AE;
  --accent:#FFFFFF; --save:#FFFFFF; --pay:#FFFFFF;
  --hero:#271358; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.18); --hero-fill:#E86C6C; --hero-chip:rgba(255,255,255,.14);
  --t-ok:#EDECF3; --t-ok-ink:#000000; --t-warn:#E86C6C; --t-warn-ink:#000000; --t-grey:#24242B; color-scheme:dark;
}
/* Типографика: 15 — текст и заголовки блоков, 13 — подписи и вторичное, 24 — ключевые суммы, 20 — заголовок страницы.
   Начертания: 400 и 600. Цвет: ink — основное, muted — вторичное, save/pay — только статус суммы, accent — только управление.
   Сетка: шаг 4 px; внутри блока отступ 16, между элементами 12, строки списков 8 по вертикали, вложенные строки сдвинуты на 12. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:20px 16px 40px;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;font-weight:600;line-height:1.2;margin:0 0 4px}
h2,.h3{font-size:15px;font-weight:600;line-height:1.45;margin:0}
.h3{margin-top:4px}
b{font-weight:600}
.sub,.lbl,.sm,.when{font-size:13px;font-weight:400;color:var(--muted);margin:0}
.pos{color:var(--save)}
.neg{color:var(--pay)}
.err,#xerr,#derr,#cerr{font-size:13px;color:var(--pay)}
.err:empty,#xerr:empty,#derr:empty,#cerr:empty{display:none}

/* Блоки */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.tg{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;user-select:none;-webkit-tap-highlight-color:transparent}
.tg::after,.ph .pt::after{content:'▾';display:inline-block;font-size:13px;font-weight:400;line-height:1;color:var(--muted);transition:transform .15s}
.ph .pt::after{margin-left:6px}
section.collapsed>.tg::after,#bh .hm.closed .hmh::after,.per.closed .ph .pt::after{transform:rotate(-90deg)}
section.collapsed>:not(h2){display:none!important}
@media (prefers-reduced-motion:reduce){.tg::after,#bh .hmh::after,.ph .pt::after{transition:none}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.tabs button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-radius:9px;padding:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
main[data-tab="day"]>section[data-tab="long"],main[data-tab="long"]>section[data-tab="day"]{display:none!important}


/* Строки списков и таблиц */
.debts,.lst{width:100%;border-collapse:collapse}
.debts td,.lst td{padding:8px 0;border-top:1px solid var(--line);vertical-align:middle}
.debts tr:first-child td,.lst tr:first-child td{border-top:0}
.debts td:first-child{width:32px}
.debts td:nth-child(3),.debts td:nth-child(4),.lst td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.debts td:nth-child(4),#xt td:first-child{color:var(--muted)}
#xt td:first-child{width:auto;white-space:nowrap;padding-right:12px}
#xt td:nth-child(2){width:100%}
#xt td:nth-child(3){text-align:right;white-space:nowrap}
.debts tr.paid td:not(:first-child){text-decoration:line-through;color:var(--muted)}
.debts input,.si input,.wi input,.df .ck input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--save);flex:none;display:block}
.lst .sub{margin-top:2px}
.wi,.si{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wi:first-child,.si:first-child{border-top:0}
.wi .nm,.si label{flex:1;min-width:0;overflow-wrap:anywhere}
.wi .pr{white-space:nowrap;color:var(--muted)}
.wi.ok .pr{color:var(--save)}
.wi.done,.si.done{color:var(--muted)}
.wi.done .nm,.si.done label{text-decoration:line-through}

/* История трат */
#bh{display:grid}
#bh span{min-width:0}
#bh>.tot,#bh .hmb>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
#bh>.tot{border-top:0;font-weight:600}
#bh b{font-weight:400;white-space:nowrap}
#bh .tot b,#bh .hmh b{font-weight:600}
#bh .hm{border-top:1px solid var(--line)}
#bh .hm.closed .hmb{display:none}
#bh .hmh{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:0;padding:8px 0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
#bh .emp{color:var(--muted)}
#bh .hd{font-style:normal;color:var(--muted);display:inline-block;min-width:3.4em}

/* График по периодам */
.per{border-top:1px solid var(--line)}
.per:first-child{border-top:0}
.ph{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:0;padding:8px 0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.ph .pt{font-weight:600;flex:1}
.ph b{white-space:nowrap}
.per .tag{font-size:13px;color:var(--muted)}
.per.closed .pbd{display:none}
.pbd{display:grid;gap:4px;padding-bottom:12px}
.pl,.pi,.ps>div{display:flex;justify-content:space-between;gap:12px}
.pl{font-weight:600;margin-top:8px}
.pbd>.pl:first-child{margin-top:0}
.pi{font-size:13px;color:var(--muted);padding-left:12px}
.pi span:last-child,.pl b,.ps b{white-space:nowrap}
.ps{display:grid;gap:4px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:600}
.pf{font-size:13px;color:var(--muted)}
.pf .nw{white-space:nowrap}

/* Формы и кнопки */
.bud form,.df{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bud input,.df input,.df select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.df input{flex:1 1 120px}
.bud input[type=number]{flex:1 1 90px;width:90px}
.bud #bn{flex:1 1 120px}
.bud input[type=date],.df input[type=date]{flex:none;width:9.2em}
.df .fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 120px;min-width:0}
.df .fl input{flex:none;width:100%}
.df .ck{display:flex;align-items:center;gap:8px}
.bud button,.df button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.bud input[type=checkbox]:disabled{opacity:.4}
:root[data-theme="dark"] .bud button,:root[data-theme="dark"] .df button{color:#0E141A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bud button,:root:not([data-theme="light"]) .df button{color:#0E141A}}
.addp{justify-self:start;font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.panel button.x,.panel button.hx,.panel button.wx{background:none;border:0;border-radius:0;color:var(--muted);font:inherit;font-size:17px;font-weight:400;line-height:1;padding:0 0 0 12px;cursor:pointer}

/* Подвал */
.ft{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:4px 0}
.bkm{font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Дизайн-система v2 (пилот: «Каждый день») =====
   Шрифт Golos Text. Роли текста:
   .big-n — главная сумма экрана, 64/800, единица 22/700;  .mid-n — сумма блока, 36/800, единица 18/600;
   h1 — 30/800;  h2 — 20/800;  текст — 15/400;  подпись .lbl — 14/400 muted;  шильдик .tag — 12/700.
   Цифры всегда табличные, крупные — с плотным трекингом.
   Поверхности: фон --bg, карточка-блок --surface (радиус 24, без рамки), главный блок экрана — цветная --hero.
   Внутри карточки без подложек: строки на разделителях, итоги — строкой с точечным лидером (.lead).
   Управление: тёмные пилюли (кнопки, вкладки), поля — заливка --field без рамки. */
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 8px}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
/* Переключатель вкладок: дорожка и бегунок, бегунок едет за main[data-tab] */
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);padding:4px;border-radius:999px}
.tabs::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--ink);transition:transform .2s ease}
main[data-tab="long"] .tabs::before{transform:translateX(100%)}
.tabs button{position:relative;padding:10px 12px;border-radius:999px;background:none;color:var(--muted);transition:color .2s}
.tabs button[aria-selected="true"]{background:none;color:var(--bg)}
@media (prefers-reduced-motion:reduce){.tabs::before,.tabs button{transition:none}}
.panel{border:0;border-radius:24px;padding:20px;grid-template-columns:minmax(0,1fr)}
.tg::after{content:'▾';width:32px;height:32px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:12px;color:var(--ink);flex:none}
.bud button,.df button{border-radius:999px;padding:12px 20px;background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] .bud button,:root[data-theme="dark"] .df button{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bud button,:root:not([data-theme="light"]) .df button{color:var(--bg)}}
.bud input:not([type=checkbox]),.df input:not([type=checkbox]),.df select{background:var(--field);border:0;border-radius:14px;padding:12px 14px}

/* Крупные числа */
.big-n,.mid-n{display:flex;align-items:baseline;gap:4px;font-weight:800;line-height:1;letter-spacing:-.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.big-n .n{font-size:64px}
.big-n .u{font-size:22px;font-weight:700;letter-spacing:0}
.mid-n .n{font-size:36px}
.mid-n .u{font-size:18px;font-weight:600;letter-spacing:0;opacity:.7}
.lbl{font-size:14px}

/* Точечный лидер: «название ……… сумма» */
.lead{display:flex;align-items:baseline;gap:8px}
.lead i{flex:1;min-width:16px}
.lead b{font-weight:600;white-space:nowrap}

/* Шильдик */
.tag{display:inline-block;font-size:12px;font-weight:700;line-height:1;padding:5px 9px;border-radius:999px;background:var(--t-grey);color:var(--ink);white-space:nowrap;vertical-align:1px}
.tag.t-ok{background:var(--t-ok);color:var(--t-ok-ink)}
.tag.t-warn{background:var(--t-warn);color:var(--t-warn-ink)}
#today .tag.t-ok{background:var(--surface);color:var(--ink)}
#today .tag.t-grey{background:var(--hero-chip);color:var(--hero-ink)}
#today .lead b .tag{vertical-align:1px}

/* Прогресс-бар: заполнение — потрачено, засечка — норма на сегодня */
#today{background:var(--hero);color:var(--hero-ink);gap:16px}
#today .lbl{color:var(--hero-ink);opacity:.75}
#today .lead i{border-color:currentColor;opacity:.3}
#today .tg::after{background:var(--hero-chip);color:var(--hero-ink)}
/* Две колонки: «Можно сегодня» и «Потрачено» с подковой */
#today .hgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:var(--hlg,8px);margin-bottom:var(--hgap,0px)}
#bt,#bm{display:contents}
#bt>*,#bm>*{justify-self:center;text-align:center}
#bt .big-n{grid-area:1/1;align-self:end;justify-content:center}
#bm .gauge{grid-area:1/2}
#bt .lbl{grid-area:2/1}
#bm .lbl{grid-area:2/2}
/* «Можно» высотой до верхней трети подковы, сумма в подкове меньше и не касается дуги */
#bt .big-n .n{font-size:76px}
#bt .big-n .u{font-size:24px;font-weight:700}
.gauge .gnum .n{font-size:43px}
.gauge .gnum .u{font-size:18px;font-weight:700}
/* Точная подгонка по макету Полины: подписи ниже на 10, «можно» выше на 23, сумма в подкове выше на 13 */
#bt .big-n{position:relative;top:var(--dy0,8.5px)}
.gauge .gnum{transform:translate(3px,var(--dy1,4px))}
.gauge{position:relative;width:150px;max-width:100%;padding-bottom:0}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gauge path{fill:none;stroke-width:11;stroke-linecap:round}
.gauge .gt{stroke:var(--hero-track)}
.gauge .gf{stroke:var(--hero-fill)}
.gauge .gnum{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:baseline;gap:3px;font-weight:800;letter-spacing:-.04em;line-height:1}
#bl{display:grid;gap:8px}
#today .lead>span,#today .lbl{font-size:15px;color:var(--hero-ink);opacity:.75}
#today .lead b{font-weight:400}

/* История трат */
#bh>.tot{display:grid;gap:4px;padding:16px 0 4px}
#bh>.tot span{font-size:15px;font-weight:400;color:var(--muted)}
#bh>.tot b small{font-size:.5em;font-weight:700;letter-spacing:0;margin-right:2px}
#bh>.tot b{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1}
#bh .hm{border-top:0}
#bh .hmh{padding:14px 0;font-size:15px;font-weight:600}
#bh .hmh b{font-weight:600;margin-left:auto}
#bh .hmh::after{content:'▾';margin-left:6px;font-size:13px;font-weight:400;line-height:1;color:var(--muted);flex:none;transition:transform .15s}
#bh .hmb>div{padding:8px 0;border-top:0}
#bh .hmb>div:first-child{padding-top:2px}
#bh .hmb b{font-weight:400}

/* Чекбоксы списков */
#shop input[type=checkbox],#wish input[type=checkbox],#dt input[type=checkbox],#xl,.obr .ol{-webkit-appearance:none;appearance:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
#shop input[type=checkbox]:checked,#wish input[type=checkbox]:checked,#dt input[type=checkbox]:checked,#xl:checked,.obr .ol:checked{background:var(--ink)}
#shop input[type=checkbox]:checked::before,#wish input[type=checkbox]:checked::before,#dt input[type=checkbox]:checked::before,#xl:checked::before,.obr .ol:checked::before{content:'';width:10px;height:5px;border:solid var(--surface);border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
#wish input[type=checkbox]:disabled,#xl:disabled{opacity:.3;cursor:default}
.wi,.si{padding:10px 0;border-top:0}
.wi .pr{color:var(--ink)}
.wi .pr.t-ok{color:var(--t-ok-ink)}
.wi.done .pr{opacity:.6}
/* Форма траты */
/* Формы добавления: поля с подчёркиванием без заливки, кнопка справа (История трат, Список покупок, Хотелки) */
.panel .addf{display:grid;gap:12px}
.panel .addf .amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);cursor:text}
.panel .addf .amt:focus-within,.panel .addf input[type=text]:focus{border-color:var(--ink)}
.panel .addf .amt input{flex:1;width:100%;min-width:0;border:0;border-radius:0;background:none;padding:10px 0;color:var(--ink);outline:none;-moz-appearance:textfield}
.panel .addf .amt input::-webkit-outer-spin-button,.panel .addf .amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.panel .addf .amt span{color:var(--muted)}
.panel .addf input[type=text]{border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding:10px 0;outline:none}
.panel .addf .addr{display:flex;align-items:center;gap:8px}
.panel .addf .addr button{margin-left:auto}
.panel .addf .frow{display:flex;align-items:flex-end;gap:12px}
.panel .addf .frow>input,.panel .addf .frow>.amt{flex:1;min-width:0}
.panel .addf .frow>button{flex:none}
.dpill{position:relative;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:var(--field);font-weight:600;cursor:pointer}
.dpill::after{content:'▾';font-size:11px;color:var(--muted)}
.dpill:focus-within{outline:2px solid var(--ink);outline-offset:2px}
#bf .dpill #bd{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}
/* Шкала отступов: 4 · 8 · 12 · 16 · 24. Внутри блока между элементами — 16; цифра → подпись — 8;
   инфографика → список — 16 + 16; строки списков — 8 по вертикали; поля формы друг под другом — 12; поле → кнопка в строке — 24 */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px}
.panel{gap:var(--s4)}
#today{gap:var(--s4)}
#today .hgrid{row-gap:var(--s2);margin-bottom:var(--s4)}
#bl{gap:var(--s2)}
.panel .addf{gap:var(--s3);grid-template-columns:minmax(0,1fr)}
.panel .addf .frow>input{width:100%}
.panel .addf .frow{gap:var(--s5)}
#bh .hmb>div{padding:var(--s2) 0}
#bh .hmb>div:first-child{padding-top:0}
#bh .hmh{padding:var(--s3) 0}
#bh>.tot{padding:var(--s4) 0 0;gap:var(--s1)}
.wi,.si{padding:var(--s2) 0}
/* Кнопки удаления не наследуют заливку пилюль */
:root .panel button.x,:root .panel button.hx,:root .panel button.wx{background:none;color:var(--muted);padding:0 0 0 12px;border-radius:0}
/* «Долгосрок» на правилах v2: без разделителей, строки как в истории трат — дата приглушённой колонкой, что, сумма */
.debts td,.lst td{border-top:0;padding:var(--s2) 0}
#dt td:first-child{width:36px}
#dt td:nth-child(3){color:var(--muted);text-align:right;white-space:nowrap;padding-left:12px}
#dt td:nth-child(4){color:var(--ink);text-align:right;white-space:nowrap;padding-left:12px}
#dt td:nth-child(5){width:1%;white-space:nowrap}
#dt tr.paid td:not(:first-child){color:var(--muted)}
.panel .dpill>input,.panel .dpill>select{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
.panel .addf .ck{display:inline-flex;align-items:center;gap:8px}
.nr>span,.pi>span:first-child{display:flex;min-width:0}
.nr .hd,.pi .hd{flex:none}
.nl{display:grid;gap:var(--s2)}
.nr,.pi,.pf>div,.ps>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.nr b,.pi>span:last-child,.pf b{font-weight:400;white-space:nowrap}
.nr.ok span,.nr.ok b{color:var(--muted);text-decoration:line-through}

<script>
/* Локальное хранилище вместо базы Claude: данные живут в localStorage этого браузера. */
(function(){
  const SEED={}, KEY='saver-db-v1', subs={};
  let mem=null;
  function load(){ if(mem) return mem; try{ const r=localStorage.getItem(KEY); mem=r?JSON.parse(r):null; }catch(_){ } if(!mem) mem=JSON.parse(JSON.stringify(SEED)); return mem; }
  function save(c){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(_){ } emit(c); }
  function snap(c){ const o=load()[c]||{}; return {docs:Object.keys(o).sort().map(id=>({id,data:()=>JSON.parse(JSON.stringify(o[id]))}))}; }
  function emit(c){ (subs[c]||[]).forEach(f=>f(snap(c))); }
  const db={
    doc(p){ const [c,id]=p.split('/'); const col=()=>(load()[c]=load()[c]||{});
      return { async set(d){ col()[id]=d; save(c); }, async update(d){ col()[id]=Object.assign({},col()[id],d); save(c); }, async delete(){ delete col()[id]; save(c); } }; },
    collection(c){ return { onSnapshot(f){ (subs[c]=subs[c]||[]).push(f); setTimeout(()=>f(snap(c)),0); return ()=>{}; } }; }
  };
  window.claude={use:async n=>n==='db'?db:null};
})();
</script>
<script>
(function(){
  const eur=n=>'€'+n.toLocaleString('ru-RU').replace(/\s/g,' ').replace(',','.');
  const dim=(y,m)=>new Date(y,m,0).getDate();
  const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const TAGS={};
  const ev=[];
  const pdt=s=>{const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]);};
  const isISO=s=>/^\d{4}-\d\d-\d\d$/.test(String(s||''));
  // Настройки из опросника: лимит в день (L), старт и горизонт плана; поступления (inc) и регулярные расходы (rec)
  let cfg=null, L=20, START=new Date(), incs=[], recs=[], LD=[];
  START.setHours(0,0,0,0);
  // План: поступления по месяцам от старта на горизонт. Поступление «на жизнь» оплачивает лимит до следующего такого же
  // и регулярные расходы этих дней; остаток — в копилку. kind 'sal' — факт зарплаты из «Поступлений» заменяет плановую сумму
  function gen(){
    const out=[]; if(!cfg) return out;
    const s=START, last=new Date(s.getFullYear(),s.getMonth()+cfg.horizon,s.getDate()), at=(y,m,d)=>new Date(y,m-1,Math.min(d,dim(y,m)));
    const months=[]; for(let i=0;i<=cfg.horizon;i++){ const d=new Date(s.getFullYear(),s.getMonth()+i,1); months.push([d.getFullYear(),d.getMonth()+1]); }
    months.forEach(([y,m])=>incs.forEach(x=>{ const d=at(y,m,x.day); if(d<s||d>last) return;
      out.push({date:d,y,m,d:d.getDate(),inc:x.amount,plan:x.amount,carry:0,incNote:x.name.toLowerCase(),pays:[],kind:x.life?'sal':'',life:x.life}); }));
    out.sort((a,b)=>(a.date-b.date)||(b.life-a.life));
    const lives=out.filter(e=>e.life);
    lives.forEach((e,i)=>{ const to=lives[i+1]?lives[i+1].date:new Date(e.y,e.m,e.d), n=Math.round((to-e.date)/864e5);
      if(n>0) e.pays.push(['на жизнь '+n+' дн. × '+eur(L),Math.round(n*L*100)/100]); });
    // Регулярный расход — с последнего поступления «на жизнь» не позже его даты (раньше первого — с первого)
    const pool=lives.length?lives:out;
    if(pool.length) months.forEach(([y,m])=>recs.forEach(r=>{ const d=at(y,m,r.day); if(d<s||d>last) return;
      let o=pool[0]; pool.forEach(e=>{ if(e.date<=d) o=e; }); o.pays.push([r.name.toLowerCase(),r.amount,null,iso(d)]); }));
    LD=lives.map(e=>e.date);
    return out;
  }
  const PAYS=[];
  const pOpen={};
  const today=new Date(); today.setHours(0,0,0,0);
  let extras=[], planOk=false, gone={}, myDebts=[];
  const MOVE={}; // траты вне дневного лимита, в шаблоне нет
  const money=t=>parseFloat(String(t).replace(/[^\d,.]/g,'').replace(',','.'))||0;
  // Сколько ушло за день по истории трат: записи, покупки для переезда, оплаченные платежи
  function dayOut(){
    const big={}, out={}, put=(k,v)=>{ out[k]=(out[k]||0)+v; };
    document.querySelectorAll('#dt tr.paid:not([hidden])').forEach(tr=>{ const d=tr.dataset.d; if(!d||!tr.cells[3]) return; const i=tr.querySelector('input[data-p]');
      (big[d]=big[d]||[]).push([tr.cells[1].textContent,tr.cells[3].textContent,i?'p:'+i.dataset.p:'c:'+tr.dataset.c]); });
    for(const k in spend) put(k,spend[k]); for(const k in MOVE) if(!gone['move-'+k]) put(k,MOVE[k]); for(const k in big) big[k].forEach(x=>put(k,money(x[1])));
    return {out,big};
  }
  const ds=e=>String(e.d).padStart(2,'0')+'.'+String(e.m).padStart(2,'0');
  const cap=s=>s[0].toUpperCase()+s.slice(1);
  function build(){
    ev.length=0; gen().forEach(e=>ev.push(e));
    const toEur=eurOf;
    // Факт зарплаты заменяет плановую сумму ближайшего поступления того же вида
    // Сверка заменяет вписанный остаток (carry) следующего поступления «на жизнь»: фактический остаток уже учтён
    const isLv=e=>!e.start&&!e.xid&&e.pays.some(p=>/^на жизнь/.test(p[0]));
    extras.filter(x=>x.kind==='bal').forEach(x=>{ const d=new Date(x.date+'T00:00'), o=ev.filter(e=>isLv(e)&&e.date>d).sort((a,b)=>a.date-b.date)[0]; if(o) o.carry=0; });
    extras.filter(x=>x.kind==='sal'||x.kind==='adv').forEach(x=>{ const d=new Date(x.date+'T00:00'); let o=null;
      ev.forEach(e=>{ if(e.kind===x.kind&&(!o||Math.abs(e.date-d)<Math.abs(o.date-d))) o=e; });
      if(o) o.fact=(o.fact||0)+toEur(x); });
    ev.forEach(e=>{ const got=e.fact!=null?e.fact:e.plan, w=e.kind?e.incNote:'';
      e.inc=e.carry+got;
      if(w) e.incNote=(e.carry?'остаток '+e.carry+' + ':'')+w+(e.fact!=null?' '+got+(got!==e.plan?' (план '+e.plan+')':''):e.carry?' ~'+got:'');
      const r=e.inc-e.pays.reduce((a,x)=>a+x[1],0);
      if(e.start){ e.save=0; e.need=0; } else { e.save=Math.max(0,r); e.need=Math.max(0,-r); } });
    // Платежи из таблицы и добавленные вручную списываются с последнего поступления «на жизнь» (или стартового баланса) не позже их даты
    const lives=ev.filter(e=>!e.xid&&e.pays.some(x=>/^на жизнь/.test(x[0]))), tg=ev.filter(e=>e.start||lives.includes(e));
    const fixed=PAYS.filter(x=>!gone[x[0]]).map(([id,name,a,date])=>{ const i=document.querySelector('#dt input[data-p="'+id+'"]'); return {id,name,amount:money(a),date,done:!!(i&&i.checked)}; });
    fixed.concat(myDebts).forEach(x=>{ const d=new Date(x.date+'T00:00'); if(!(x.amount>0)||!tg.length) return;
      let o=lives[0]; tg.forEach(e=>{ if(e.date<=d) o=e; });
      o.pays.push([x.name,x.amount,x.id,x.date,x.done]); if(o.start) return;
      const c=Math.min(o.save,x.amount); o.save-=c; if(x.amount>c) o.need=(o.need||0)+x.amount-c; });
    // Нехватку поступления «на жизнь» закрывают поступления без жизни в том же периоде (разовые поступления)
    ev.forEach(e=>{ if(e.start||lives.includes(e)||!(e.save>0)) return; let prev=null; lives.forEach(o=>{ if(o.date<=e.date) prev=o; });
      if(!prev||!(prev.need>0)) return; const c=Math.min(prev.need,e.save); prev.need-=c; prev.covered=(prev.covered||0)+c; e.save-=c;
      e.pays.push(['закрыть нехватку '+ds(prev),c]); });
    extras.filter(x=>!x.kind).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{
      const p=x.date.split('-').map(Number), d=new Date(p[0],p[1]-1,p[2]);
      const amt=toEur(x);
      const e={date:d,y:p[0],m:p[1],d:p[2],inc:amt,incNote:(x.note||'поступление'),pays:[],save:amt,xid:x.id};
      // С галочкой «на жизнь» — целиком в дневной лимит («Можно сегодня»), не в копилку и не на нехватку
      if(x.life){ e.pays.push(['в лимит на жизнь',amt]); e.save=0; ev.push(e); return; }
      let prev=null; ev.forEach(o=>{ if(!o.xid&&o.date<=d&&o.need>0) prev=o; });
      if(prev){ const c=Math.min(prev.need,amt); prev.need-=c; prev.covered=(prev.covered||0)+c;
        e.pays.push(['закрыть нехватку '+ds(prev),c]); e.save=amt-c; }
      ev.push(e);
    });
    // Сверка: на счету на дату. Свободно = на счету − svDue(); копилку Полина не переводит, поэтому план ждёт на счету жизнь до следующего
    // поступления (дни × L) плюс итог периода (отложенное минус нехватка). Меньше ожидаемого — разница уменьшает копилку периода (остаток — нехватка);
    // больше — закрывает нехватку, остальное в копилку (на жизнь остаётся не больше L в день).
    // Считаются только события периода не позже даты сверки: будущие поступления (разовые поступления) ещё не пришли
    extras.filter(x=>x.kind==='bal').sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id)).forEach(x=>{
      const p=x.date.split('-').map(Number), d=new Date(p[0],p[1]-1,p[2]), [ps,pn]=perOf(d), pe=ev.filter(e=>e.date>=ps&&e.date<=d);
      // Копилка лежит там же, где деньги на жизнь: «на счету» — все деньги, поэтому план ждёт всё накопленное к дате сверки, а не только этот период
      const net=ev.filter(e=>e.date<=d).reduce((a,e)=>a+e.save-(e.need||0),0), have=toEur(x);
      const corr=Math.round(have-svDue(x)-Math.round((pn-d)/864e5)*L-net);
      const e={date:d,y:p[0],m:p[1],d:p[2],inc:Math.max(0,corr),incNote:'сверка, на счету '+eur(have),pays:[],save:Math.max(0,corr),need:0,xid:x.id};
      if(corr<0){ let r=-corr; e.pays.push(['сверка',r]); pe.slice().reverse().forEach(o=>{ const c=Math.min(Math.max(0,o.save),r); o.save-=c; r-=c; }); e.need=r; }
      pe.forEach(o=>{ if(!(o.need>0)||!(e.save>0)) return; const c=Math.min(o.need,e.save); o.need-=c; o.covered=(o.covered||0)+c; e.save-=c; e.pays.push(['закрыть нехватку '+ds(o),c]); });
      // Нехватка от прошлых сверок периода гасится отложенным, которое пришло позже : деньги на одной карте
      const all=pe.concat(e); all.forEach(o=>{ all.forEach(q=>{ if(q===o||!(o.need>0)||!(q.save>0)) return; const c=Math.min(o.need,q.save); o.need-=c; q.save-=c; }); });
      ev.push(e);
    });
    ev.sort((a,b)=>a.date-b.date);
    // Нехватку периода закрывает копилка: в итог идёт отложенное минус нехватка
    let t=0; ev.forEach(e=>{t+=e.save-(e.need||0);e.total=t;});
  }
  build();

  // Дневной бюджет: лимит в день со старта, перерасход и экономия переносятся
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  // Общие правила для плана и «Можно сегодня»: время создания записи по id, период между поступлениями «на жизнь»
  function eurOf(x){ return Math.round(x.amount*100)/100; }
  function tsOf(x){ return Number(String(x.id).slice(1))||0; }
  // Период — между поступлениями «на жизнь»; без них — месяц от старта
  function perOf(t){ let ps=null, pn=null; LD.forEach(d=>{ if(d<=t) ps=d; else if(!pn) pn=d; });
    if(!ps||ps<START){ ps=new Date(START); if(!LD.length) while(new Date(ps.getFullYear(),ps.getMonth()+1,ps.getDate())<=t) ps=new Date(ps.getFullYear(),ps.getMonth()+1,ps.getDate()); }
    if(!pn) pn=new Date(ps.getFullYear(),ps.getMonth()+1,ps.getDate()); return [new Date(ps),new Date(pn)]; }
  // Сверка: платежи её периода до следующего поступления, не отмеченные оплаченными на момент сверки (просроченные тоже).
  // У старых сверок без снимка отметок — платежи с её даты
  function svDue(x){ const [ps,pn]=perOf(new Date(x.date+'T00:00')), lo=x.paid?iso(ps):x.date, hi=iso(pn), pd=x.paid||[];
    return PAYS.filter(q=>!gone[q[0]]).map(q=>({id:q[0],a:money(q[2]),d:q[3]})).concat(myDebts.map(m=>({id:m.id,a:m.amount,d:m.date})))
      .filter(q=>q.d>=lo&&q.d<hi&&!pd.includes(q.id)).reduce((a,q)=>a+q.a,0); }
  const addD=(d,k)=>{const x=new Date(d);x.setDate(x.getDate()+k);return x;};
  const dm=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
  let spend={}, items={}, wishes=null, curBal=0; const mOpen={};
  document.getElementById('today').innerHTML='<h2 style="margin:0">Траты на жизнь</h2><div class="hgrid"><div id="bt"></div><div id="bm"></div></div><div id="bl"></div>';
  const bd=document.getElementById('bd'), ba=document.getElementById('ba'), bt=document.getElementById('bt'), bm=document.getElementById('bm'), bl=document.getElementById('bl'), be=document.getElementById('be');

    const xk=document.getElementById('xk'), xl=document.getElementById('xl'); xk.addEventListener('change',()=>{ xl.disabled=!!xk.value; if(xk.value) xl.checked=false; });
    // Пилюли форм «Долгосрока»: поверх подписи прозрачный select или input[type=date], подпись повторяет выбранное
    const pills=[['xd','xdl'],['xk','xkl'],['dd','ddl']].map(([i,l])=>[document.getElementById(i),document.getElementById(l)]);
    function syncP(){ pills.forEach(([i,l])=>{ l.textContent=i.tagName==='SELECT'?i.options[i.selectedIndex].text:!i.value?'дата':i.value===iso(today)?'сегодня':i.value.slice(8)+'.'+i.value.slice(5,7); }); }
    pills.forEach(([i])=>i.addEventListener('change',syncP)); syncP();
    document.getElementById('xf').addEventListener('submit',async e=>{ e.preventDefault();
      const d=document.getElementById('xd'), a=document.getElementById('xa'), nt=document.getElementById('xn');
      const amount=parseFloat(String(a.value).replace(',','.'));
      if(!d.value||!(amount>0)){ xerr.textContent='Нужны дата и сумма больше нуля.'; return; }
      xerr.textContent='';
      const lf=document.getElementById('xl'), k=document.getElementById('xk');
      const snap=k.value==='bal'?{sp:spend[d.value]||0,paid:[...document.querySelectorAll('#dt input[data-p]:checked')].map(i=>i.dataset.p).concat(myDebts.filter(x=>x.done).map(x=>x.id))}:{};
      try{ await db.doc('extra/x'+Date.now()).set(Object.assign({date:d.value,amount,note:nt.value.trim(),life:!k.value&&lf.checked,kind:k.value},snap)); a.value=''; nt.value=''; lf.checked=false; lf.disabled=false; k.value=''; syncP(); }
      catch(_){ xerr.textContent='Не сохранилось, попробуй ещё раз.'; }
    });
    db.collection('extra').onSnapshot(s=>{
      extras=[]; s.docs.forEach(d=>{const x=d.data()||{}; const a=Number(x.amount); if(x.date&&a>0) extras.push({id:d.id,date:String(x.date),amount:a,note:x.note?String(x.note):'',life:x.life===true,sp:Number(x.sp)||0,paid:Array.isArray(x.paid)?x.paid:null,kind:['sal','bal'].includes(x.kind)?x.kind:''});});
      build(); renderPlan(); renderBud();
      xt.innerHTML='';
      extras.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>{
        const tr=document.createElement('tr'), p=x.date.split('-');
        const c=[0,1,2].map(()=>document.createElement('td'));
        c[0].textContent=p[2]+'.'+p[1]; const kw=x.kind==='sal'?'зарплата':x.kind==='bal'?'на счету':x.life?'на жизнь':''; c[1].textContent=(x.note||kw||'поступление')+(kw&&x.note&&!x.note.toLowerCase().includes(kw)?', '+kw:'');
        c[2].textContent=eur(eurOf(x));
        const del=document.createElement('button'); del.type='button'; del.className='x'; del.textContent='×'; del.setAttribute('aria-label','Удалить');
        del.addEventListener('click',async()=>{ try{ await db.doc('extra/'+x.id).delete(); }catch(_){ xerr.textContent='Не удалилось, попробуй ещё раз.'; } });
        c[2].appendChild(del); tr.append(...c); xt.appendChild(tr);
      });
      if(!extras.length) xt.innerHTML='<tr><td class="sub">Пока ничего</td></tr>';
    }, ()=>{ xerr.textContent='Не удалось загрузить поступления. Обнови страницу.'; });
    db.collection('spend').onSnapshot(s=>{ spend={}; items={}; s.docs.forEach(d=>{const x=d.data()||{}, a=Number(x.amount); if(!isNaN(a)) spend[d.id]=a; if(Array.isArray(x.items)) items[d.id]=x.items.filter(i=>i&&!isNaN(Number(i.a))).map(i=>({a:Number(i.a),n:i.n?String(i.n):''}));}); renderBud(); },
      ()=>{ be.textContent='Не удалось загрузить траты. Обнови страницу.'; });
  })();

  // Настройки и опросник: cfg/main — лимит, старт, горизонт; inc — поступления; rec — регулярные расходы
  const escA=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const refresh=()=>{ build(); renderPlan(); renderBud(); renderCfg(); };
  const cfgb=document.getElementById('cfgb');
  function renderCfg(){
    if(!cfg){ cfgb.innerHTML=''; return; }
    const r=(d,t,v)=>'<div class="nr"><span><i class="hd">'+d+'</i>'+escA(t)+'</span><b>'+v+'</b></div>';
    cfgb.innerHTML='<div class="lead"><span>Лимит в день</span><i></i><b>'+eur(cfg.limit)+'</b></div>'+
      '<div class="lead"><span>План с '+dm(START)+'</span><i></i><b>'+cfg.horizon+' мес.</b></div>'+
      '<div class="pl"><span>Поступления</span></div><div class="nl">'+(incs.length?incs.slice().sort((a,b)=>a.day-b.day).map(x=>r(x.day+'-го',x.name+(x.life?'':', в копилку'),eur(x.amount))).join(''):'<p class="sub">Нет</p>')+'</div>'+
      '<div class="pl"><span>Регулярные расходы</span></div><div class="nl">'+(recs.length?recs.slice().sort((a,b)=>a.day-b.day).map(x=>r(x.day+'-го',x.name,eur(x.amount))).join(''):'<p class="sub">Нет</p>')+'</div>'+
      '<p class="sub">После каждого поступления «на жизнь» вноси в «Поступлениях» «на счету сейчас» — тогда «Можно сегодня» считается от реальных денег.</p>';
    cfgb.innerHTML=cfgb.innerHTML.replace(/(\d) (\d)/g,'$1\u00a0$2');
  }
  const ob=document.getElementById('ob'), obf=document.getElementById('obf'), obe=document.getElementById('obe'), obb=document.getElementById('obb'), obx=document.getElementById('obx');
  const STEPS=[
    ['Сколько тратить в день','Еда, транспорт, кафе, мелочи — в евро. Аренду и обязательные платежи сюда не включай, они дальше.','limit'],
    ['Сколько денег сейчас','Всё на картах и наличными, вместе с накоплениями. От этой суммы считается «Можно сегодня». Можно пропустить.','bal'],
    ['Поступления','Зарплата, стипендия, переводы — что приходит каждый месяц. «На жизнь» — с этих денег живёшь до следующего такого же поступления; без галочки — сразу в копилку.','inc'],
    ['Регулярные расходы','Аренда, связь, страховка, подписки — что платишь каждый месяц.','rec'],
    ['Разовые платежи','Долги, взносы, крупные покупки с датой. Можно пропустить.','one'],
    ['На сколько планировать','Горизонт графика накоплений, месяцев.','hor']];
  let st=0, dr=null, edit=false;
  const blank={inc:{name:'',amount:'',day:'',life:true},rec:{name:'',amount:'',day:''},one:{name:'',amount:'',date:''}};
  function openOb(isEdit){
    edit=isEdit; st=0;
    dr={limit:cfg?cfg.limit:'',bal:'',hor:cfg?cfg.horizon:12,
      inc:incs.length?incs.map(x=>Object.assign({},x)):[Object.assign({},blank.inc)],
      rec:recs.length?recs.map(x=>Object.assign({},x)):[Object.assign({},blank.rec)],one:[Object.assign({},blank.one)]};
    ob.hidden=false; showStep();
  }
  const numIn=(cls,v,ph,lbl)=>'<label class="amt"><span>€</span><input type="number" class="'+cls+'" step="0.01" min="0" inputmode="decimal" placeholder="'+ph+'" value="'+escA(v)+'" aria-label="'+lbl+'"></label>';
  function rowHtml(k,x,i){
    const top='<input type="text" class="on" maxlength="30" placeholder="'+{inc:'например, зарплата',rec:'например, аренда',one:'например, взнос'}[k]+'" value="'+escA(x.name)+'" aria-label="Название">';
    const when=k==='one'?'<label class="dpill"><span>'+(x.date?x.date.slice(8)+'.'+x.date.slice(5,7):'дата')+'</span><input type="date" class="od" value="'+escA(x.date)+'" aria-label="Дата"></label>'
      :'<label class="amt day"><input type="number" class="od" step="1" min="1" max="31" inputmode="numeric" placeholder="число" value="'+escA(x.day)+'" aria-label="Число месяца"></label>';
    return '<div class="obr" data-i="'+i+'">'+top+'<div class="frow">'+numIn('oa',x.amount,'сумма','Сумма, €')+(k==='one'?'':when)+'</div>'+
      '<div class="addr">'+(k==='inc'?'<label class="ck"><input type="checkbox" class="ol"'+(x.life?' checked':'')+'>на жизнь</label>':k==='one'?when:'<span></span>')+'<button type="button" class="x" aria-label="Убрать строку">×</button></div></div>';
  }
  function showStep(){
    const [h,t,k]=STEPS[st];
    document.getElementById('obs').textContent=(st+1)+' из '+STEPS.length;
    document.getElementById('obh').textContent=h; document.getElementById('obt').textContent=t; obe.textContent='';
    obf.innerHTML='<div class="addf">'+(k==='limit'?numIn('ov',dr.limit,'в день','Лимит в день, €'):k==='bal'?numIn('ov',dr.bal,'на счету','На счету сейчас, €'):
      k==='hor'?'<label class="amt"><input type="number" class="ov" step="1" min="1" max="60" inputmode="numeric" value="'+escA(dr.hor)+'" aria-label="Месяцев"><span>мес.</span></label>':
      dr[k].map((x,i)=>rowHtml(k,x,i)).join('')+'<button type="button" class="addp" id="obadd">+ Ещё</button>')+'</div>';
    obb.textContent=st?'Назад':'Отмена'; obb.hidden=!st&&!edit;
    obx.textContent=st===STEPS.length-1?'Готово':'Дальше';
    const f=obf.querySelector('input'); if(f&&!f.value) f.focus();
  }
  // Считать поля шага в черновик; строка списка без названия и суммы пропускается
  function collect(){
    const k=STEPS[st][2], v=c=>{ const i=obf.querySelector('.'+c); return i?i.value.trim():''; };
    if(k==='limit'||k==='bal'||k==='hor'){ dr[k]=v('ov'); return; }
    dr[k]=[...obf.querySelectorAll('.obr')].map(r=>{ const q=c=>r.querySelector('.'+c);
      const x={name:q('on').value.trim(),amount:q('oa').value.trim()}; if(k==='one') x.date=q('od').value; else x.day=q('od').value.trim(); if(k==='inc') x.life=q('ol').checked; return x; });
  }
  function check(){
    const k=STEPS[st][2], n=v=>parseFloat(String(v).replace(',','.'));
    if(k==='limit') return n(dr.limit)>=0?'':'Нужна сумма в день, от 0.';
    if(k==='bal') return dr.bal===''||n(dr.bal)>=0?'':'Сумма — число от 0 или пусто.';
    if(k==='hor') return n(dr.hor)>=1&&n(dr.hor)<=60?'':'От 1 до 60 месяцев.';
    const bad=dr[k].some(x=>(x.name||x.amount)&&!(x.name&&n(x.amount)>0&&(k==='one'?isISO(x.date):Math.round(n(x.day))>=1&&Math.round(n(x.day))<=31)));
    return bad?(k==='one'?'В каждой строке — название, сумма и дата.':'В каждой строке — название, сумма и число месяца от 1 до 31.'):'';
  }
  async function finish(){
    const n=v=>parseFloat(String(v).replace(',','.')), t=Date.now(), full=x=>x.name&&n(x.amount)>0;
    obx.disabled=true;
    try{
      for(const x of incs) await db.doc('inc/'+x.id).delete();
      for(const x of recs) await db.doc('rec/'+x.id).delete();
      let i=0;
      for(const x of dr.inc.filter(full)) await db.doc('inc/i'+(t+i++)).set({name:x.name,amount:n(x.amount),day:Math.round(n(x.day)),life:!!x.life});
      for(const x of dr.rec.filter(full)) await db.doc('rec/r'+(t+i++)).set({name:x.name,amount:n(x.amount),day:Math.round(n(x.day))});
      for(const x of dr.one.filter(full)) await db.doc('debts/c'+(t+i++)).set({name:x.name,amount:n(x.amount),date:x.date,done:false});
      if(dr.bal!==''&&n(dr.bal)>0) await db.doc('extra/x'+(t+i++)).set({date:iso(today),amount:n(dr.bal),note:'',life:false,kind:'bal',sp:spend[iso(today)]||0,paid:myDebts.filter(x=>x.done).map(x=>x.id)});
      await db.doc('cfg/main').set({start:cfg?cfg.start:iso(today),limit:n(dr.limit),horizon:Math.round(n(dr.hor))});
      ob.hidden=true;
    }catch(_){ obe.textContent='Не сохранилось, попробуй ещё раз.'; }
    obx.disabled=false;
  }
  obx.addEventListener('click',()=>{ collect(); const e=check(); if(e){ obe.textContent=e; return; } if(st<STEPS.length-1){ st++; showStep(); } else finish(); });
  obb.addEventListener('click',()=>{ if(!st){ ob.hidden=true; return; } collect(); st--; showStep(); });
  obf.addEventListener('click',e=>{ const k=STEPS[st][2];
    if(e.target.id==='obadd'){ collect(); dr[k].push(Object.assign({},blank[k])); showStep(); obf.querySelector('.obr:last-of-type .on').focus(); }
    const x=e.target.closest('.x'); if(x){ collect(); dr[k].splice(+x.closest('.obr').dataset.i,1); if(!dr[k].length) dr[k].push(Object.assign({},blank[k])); showStep(); } });
  obf.addEventListener('change',e=>{ if(e.target.type==='date'){ const v=e.target.value; e.target.previousElementSibling.textContent=v?v.slice(8)+'.'+v.slice(5,7):'дата'; } });
  document.getElementById('cfge').addEventListener('click',()=>openOb(true));
  function setup(){
    db.collection('cfg').onSnapshot(s=>{ const d=s.docs.find(d=>d.id==='main'), x=d&&d.data();
      if(!x){ cfg=null; refresh(); openOb(false); return; }
      cfg={start:isISO(x.start)?x.start:iso(today),limit:Number(x.limit)>=0?Number(x.limit):20,horizon:clamp(Math.round(Number(x.horizon)||12),1,60)};
      L=cfg.limit; START=pdt(cfg.start); refresh(); });
    db.collection('inc').onSnapshot(s=>{ incs=s.docs.map(d=>Object.assign({id:d.id},d.data()||{})).map(x=>({id:x.id,name:String(x.name||''),amount:Number(x.amount)||0,day:clamp(Math.round(Number(x.day)||1),1,31),life:!!x.life})).filter(x=>x.name&&x.amount>0); refresh(); });
    db.collection('rec').onSnapshot(s=>{ recs=s.docs.map(d=>Object.assign({id:d.id},d.data()||{})).map(x=>({id:x.id,name:String(x.name||''),amount:Number(x.amount)||0,day:clamp(Math.round(Number(x.day)||1),1,31)})).filter(x=>x.name&&x.amount>0); refresh(); });
  }

  const plan=document.getElementById('plan'), planb=document.getElementById('planb');
  // График по периодам: период начинается с поступления «на жизнь» и длится до следующего такого же
  function renderPlan(){
    if(!ev.length){ planb.innerHTML='<p class="sub" style="margin:0">График появится, когда добавишь поступления.</p>'; return; }
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const life=e=>e.pays.some(x=>/^на жизнь/.test(x[0])), P=[];
    ev.forEach(e=>{ const c=P[P.length-1];
      if(!c||(life(e)&&!e.xid&&+c.evs[0].date!==+e.date)) P.push({from:new Date(e.date),evs:[e]}); else c.evs.push(e); });
    if(P[0].from>START) P[0].from=new Date(START);
    const {out}=dayOut(), ks=Object.keys(out);
    const money=v=>eur(Math.round(v*100)/100);
    // Строка как в истории трат: дата приглушённой колонкой, что, сумма
    const li=x=>'<div class="pi"><span><i class="hd">'+x[0]+'</i>'+esc(x[1])+'</span><span>'+money(x[2])+'</span></div>';
    let html='';
    P.forEach((p,i)=>{
      const nx=P[i+1]?P[i+1].from:new Date(p.from.getFullYear(),p.from.getMonth()+1,p.from.getDate()), to=addD(nx,-1);
      const lo=i?iso(p.from):'', hi=P[i+1]?iso(nx):'9999';
      const spent=ks.reduce((a,k)=>a+(k>=lo&&k<hi?out[k]:0),0);
      const ins=p.evs.map(e=>[ds(e),cap(e.incNote),e.inc]), outs=[];
      p.evs.forEach(e=>e.pays.forEach(x=>{ if(!/^закрыть нехватку/.test(x[0])) outs.push([x[3]?x[3].slice(8)+'.'+x[3].slice(5,7):ds(e),cap(x[0]),x[1]]); }));
      const inSum=ins.reduce((a,x)=>a+x[2],0), outSum=outs.reduce((a,x)=>a+x[2],0);
      const sv=p.evs.reduce((a,e)=>a+e.save,0), need=p.evs.reduce((a,e)=>a+(e.need||0),0);
      const now=p.from<=today&&today<nx, pk=iso(p.from), open=pk in pOpen?pOpen[pk]:now, range=dm(p.from)+'–'+dm(to), net=sv-need, yr=p.from.getFullYear();
      const mk=p.from.getFullYear()+'-'+(p.from.getMonth()+1), pmk=i?P[i-1].from.getFullYear()+'-'+(P[i-1].from.getMonth()+1):'';
      const tag=TAGS[mk]&&mk!==pmk?'<span class="tag">'+TAGS[mk]+'</span>':'';
      // Год — заголовком перед первым периодом года, в датах периодов года нет
      if(!i||P[i-1].from.getFullYear()!==yr) html+='<div class="yr">'+yr+'</div>';
      html+='<div class="per'+(now?' now':'')+(open?'':' closed')+'">'+
        '<button type="button" class="ph" data-p="'+pk+'" aria-expanded="'+open+'"><span class="pt">'+range+'</span>'+(now?'<span class="tag">сейчас</span>':'')+tag+'<b>'+(net<0?'<span class="tag t-warn">−'+money(-net)+'</span>':'+'+money(net))+'</b></button>'+
        '<div class="pbd"><div class="pl"><span>Поступления</span><b>+'+money(inSum)+'</b></div>'+ins.map(li).join('')+
        (outs.length?'<div class="pl"><span>Расходы</span><b>−'+money(outSum)+'</b></div>'+outs.map(li).join(''):'')+
        '<div class="ps">'+(sv||!need?'<div><span>В копилку</span><b>'+(sv?'+':'')+money(sv)+'</b></div>':'')+(need?'<div><span>Не хватает</span><b><span class="tag t-warn">−'+money(need)+'</span></b></div>':'')+'</div>'+
        '<div class="pf"><div><span>По истории потрачено</span><b>'+money(spent)+'</b></div><div><span>В копилке</span><b>'+money(p.evs[p.evs.length-1].total)+'</b></div></div></div></div>';
    });
    // Итог под графиком — сколько будет в копилке к концу последнего периода, как «Итого за всё время» в истории
    const lp=P[P.length-1], le=addD(new Date(lp.from.getFullYear(),lp.from.getMonth()+1,lp.from.getDate()),-1), tot=Math.round(lp.evs[lp.evs.length-1].total);
    html+='<div class="ptot"><span>В копилке к '+dm(le)+'.'+le.getFullYear()+'</span><b><small>€</small>'+tot.toLocaleString('ru-RU').replace(/\s/g,'\u00a0')+'</b></div>';
    planb.innerHTML=html.replace(/(\d) (\d)/g,'$1\u00a0$2');
  }
  renderPlan(); planOk=true;
  const mainEl=document.querySelector('main');
  const setTab=t=>{ mainEl.dataset.tab=t; document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t))); try{localStorage.setItem('saver-tab',t)}catch(_){} };
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));
  let tab0='day'; try{ if(localStorage.getItem('saver-tab')==='long') tab0='long'; }catch(_){}
  if(location.hash==='#long') tab0='long'; if(location.hash==='#day') tab0='day';
  setTab(tab0);
  let fold={}; try{fold=JSON.parse(localStorage.getItem('saver-fold3')||'{}')}catch(_){}
  document.querySelectorAll('main > section').forEach((sec,i)=>{
    const hd=sec.querySelector(':scope > h2'); if(!hd) return;
    const k=sec.id||('s'+i);
    hd.classList.add('tg'); hd.setAttribute('role','button'); hd.tabIndex=0;
    const set=c=>{sec.classList.toggle('collapsed',c); hd.setAttribute('aria-expanded',String(!c));};
    set(k in fold ? !!fold[k] : sec.hasAttribute('data-closed'));
    const tog=()=>{const c=!sec.classList.contains('collapsed'); set(c); fold[k]=c?1:0; try{localStorage.setItem('saver-fold3',JSON.stringify(fold))}catch(_){}};
    hd.addEventListener('click',tog);
    hd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}});
  });
  planb.addEventListener('click',e2=>{ const h=e2.target.closest('.ph'); if(!h) return;
    const open=h.parentNode.classList.toggle('closed')===false; pOpen[h.dataset.p]=open; h.setAttribute('aria-expanded',String(open)); });
})();
</script>
</body>
</html>
